# Builds the manual (manual/, a Verso site) and uploads it as a GitHub Pages artifact.
# It runs only when started by hand (Actions > Manual > Run workflow). Publishing the artifact
# needs GitHub Pages enabled for the repository with "GitHub Actions" as the source, and a
# deployment job; this workflow builds and uploads only.
name: Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the library and the manual
        working-directory: manual
        run: |
          lake build
          lake exe leantex-manual

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manual/_out/html-multi
